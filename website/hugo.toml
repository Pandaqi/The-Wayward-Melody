baseURL = "https://thewaywardmelody.com"
languageCode = "en-us"
title = "The Wayward Melody | Online Store selling educational games, quizzes, books, puzzles, and more"
theme = "thewaywardmelody"
enableRobotsTXT = true # otherwise robots.txt will just fail and lead back to home page and that confuses search engines
summaryLength = 8

[outputs]
  home = ['html', 'csv'] # this builds data for Google Merchant Center at `/index.csv`

[params]
  showTax = true
  banners = ["banner_art_media_1", "banner_art_media_2", "banner_art_media_3", "banner_art_media_4", "banner_art_media_5", "banner_art_media_6", "banner_art_media_7", "banner_art_media_8", "banner_art_media_9", "banner_art_media_12", "banner_fun_frontier_1", "banner_fun_frontier_2", "banner_fun_frontier_3", "banner_fun_frontier_4", "banner_fun_frontier_5", "banner_fun_frontier_6", "banner_fun_frontier_7", "banner_general_1", "banner_general_3", "banner_general_4", "banner_general_7", "banner_general_8", "banner_merchandise_1", "banner_merchandise_2", "banner_merchandise_4", "banner_merchandise_5", "banner_merchandise_6", "banner_merchandise_7", "banner_merchandise_8", "banner_merchandise_9", "banner_merchandise_10", "banner_merchandise_11", "banner_puzzlepages_1", "banner_puzzlepages_2", "banner_puzzlepages_3", "banner_puzzlepages_4", "banner_puzzlepages_5", "banner_puzzlepages_6", "banner_puzzlepages_7", "banner_puzzlepages_8", "banner_puzzlepages_9", "banner_puzzlepages_10", "banner_puzzlepages_11", "banner_trivia_1", "banner_trivia_2", "banner_trivia_3", "banner_trivia_4", "banner_trivia_5", "banner_trivia_7", "banner_trivia_8", "banner_escape_rooms_1", "banner_escape_rooms_2", "banner_escape_rooms_3", "banner_escape_rooms_4",  "banner_escape_rooms_6", "banner_escape_rooms_7", "banner_escape_rooms_8", "banner_escape_rooms_9", "banner_escape_rooms_10", "banner_escape_rooms_12", "banner_escape_rooms_13", "banner_sneakpeeks_1", "banner_sneakpeeks_2", "banner_sneakpeeks_3", "banner_sneakpeeks_4", "banner_sneakpeeks_5", "banner_sneakpeeks_6", "banner_sneakpeeks_7", "banner_educational_1", "banner_educational_2", "banner_educational_3", "banner_educational_4", "banner_educational_5", "banner_educational_6", "banner_educational_7", "banner_educational_8", "banner_educational_9", "banner_educational_10", "banner_educational_11", "banner_educational_13", "banner_educational_14", "banner_educational_15"]

[markup.goldmark.renderer]
  unsafe = true

[pagination]
  disableAliases = true
  pagerSize = 10

# removed (because not useful enough): paper-fixed = "paper-fixed", requirements = "requirements", guardian-cant-play = "guardian-cant-play",  linear = "linear"
[taxonomies]
