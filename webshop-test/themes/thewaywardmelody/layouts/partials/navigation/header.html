<header class="bg-color-dark-x text-color-light-xx font-heading padding-s font-size-m background-texture">
    <nav>
        <!-- @NOTE: These class names MUST be present for Snipcart to recognize this as the "open cart" button --->
        <div class="position-absolute anchor-top-right padding-s bg-color-dark-x rounded-xs background-texture">
            <a href="#" title="Go To Checkout" class="snipcart-checkout">
                <div class="metadata-icon metadata-icon-cart"></div>
                <span class="snipcart-total-price"></span>
                (<span class="snipcart-items-count"></span> Items)
            </a><br>
            <a href="#" class="snipcart-customer-signin" title="Create/Visit Account">
                <div class="metadata-icon metadata-icon-account"></div>
                <span>Account</span>
            </a>
        </div>

        <!--- Main (clickable) logo and name --->
        {{ if .IsHome }}
        <a href="{{ .Site.BaseURL }}" id="header-logo" class="flex flex-center margin-s height-xs gap-s">
            <img src="/css/logos/twwm_favicon_minimal.png" style="filter:invert()" alt="Webshop Logo (The Wayward Melody)">
            <h1 class="hide-m">The Wayward Melody</h1>
        </a>
        {{ end }}

        <!--- All major categories to visit --->
        <ul class="remove-list-styling flex flex-wrap flex-center gap-xs margin-s">
            {{ if not .IsHome }}
            <li><a href="/" class="theme-general navigation-link">
                <div class="store-icon show-m"></div>
                <span class="hide-m">Home</span>
            </a></li>
            {{ end }}
            <li><a href="/explorers/" class="theme-art-explorers navigation-link">
                <div class="faction-icon faction-icon-explorers show-m"></div>
                <span class="hide-m">Explorers</span>
            </a></li>
            <li><a href="/sneakpeeks/" class="theme-sneakpeeks navigation-link">
                <div class="faction-icon faction-icon-sneakpeeks show-m"></div>
                <span class="hide-m">Sneakpeeks</span>
            </a></li>
            <li><a href="/teachers/" class="theme-teachers navigation-link">
                <div class="faction-icon faction-icon-teachers show-m"></div>
                <span class="hide-m">Teachers</span>
            </a></li>
            <li><a href="/quizmasters/" class="theme-quizmasters navigation-link">
                <div class="faction-icon faction-icon-quizmasters show-m"></div>
                <span class="hide-m">Quizmasters</span>
            </a></li>
            <li><a href="/puzzlepages/" class="theme-puzzlepages navigation-link">
                <div class="faction-icon faction-icon-puzzlepages show-m"></div>
                <span class="hide-m">Puzzlepages</span>
            </a></li>
            <li><a href="/runaways/" class="theme-runaways navigation-link">
                <div class="faction-icon faction-icon-runaways show-m"></div>
                <span class="hide-m">Runaways</span>
            </a></li>
            <li><a href="/gamiverses/" class="theme-gamiverses navigation-link">
                <div class="faction-icon faction-icon-gamiverses show-m"></div>
                <span class="hide-m">Gamiverses</span>
            </a></li>
        </ul>
    </nav>
</header>
