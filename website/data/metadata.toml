[spell]
    desc = "To which group of products or which chunk of the curriculum it belongs."

[charm]
    desc = "The specific type of product. Example: Digital Escape Room."

[categories]
    desc = "To which general categories, tags or genres this activity belongs."

[duration]
    unit = "m"
    desc = "Expected duration of one instance of the activity."

[age]
    unit = "yrs"
    desc = "Recommended minimum age. There are no maximum ages for our activities and experiences!"

[difficulty]
    unit = "/5"
    desc = "How challenging it is to complete this activity."

[setup]
    unit = "/5"
    desc = "How long or complex the preparation/setup is for this activity."

[prior-wisdom]
    name = "Prior Wisdom"
    desc = "Whether you need prior knowledge, or the ability to look things up, for this activity."

[color]
    desc = "Whether printing in color is required or highly recommended."

[mature]
    desc = "Whether the activity has mature themes. By default, all activities on this website are family-friendly."

[textless]
    desc = "Whether the activity is (mostly) textless or language independent. For most of our products, someone needs to read at least a little bit."

[parallel-play]
    name = "Parallel Play"
    desc = "Whether this activity allows multiple people to do (different) things at the same time."

[double-sided-required]
    name = "Double-Sided Required"
    desc = "Whether you MUST print this material double-sided. By default, ALL our products CAN be printed double-sided."

[guardian-required]
    name = "Guardian Required"
    desc = "Whether this activity requires a Guardian (or Game Master) to host/lead/manage it."

[guardian-cant-play]
    name = "Guardian Can't Play"
    desc = "Whether the person preparing/hosting the activity can't play along themselves. Example: you prepared an escape room and already know the answers."

[hybrid]
    desc = "A hybrid game is played both physically (e.g. with paper or cards) AND digitally (e.g. a website or your phone)."

[paper-fixed]
    name = "Paper Fixed"
    desc = "Whether the material can only be printed on the paper format provided; usually A4. By default, ALL our products still work on any other paper format."

[linear]
    name = "Linear"
    desc = "Whether the experience is linear, or you can choose where to start, stop or skip something."

[requirements]
    desc = "Required material or skills before doing this activity."

[indoors]
    desc = "Whether the activity MUST be played indoors. It likely or practically CAN'T be done outdoors."

[outdoors]
    desc = "Whether the activity MUST be played outdoors. It likely or practically CAN'T be done indoors."

[language]
    desc = "The language used in and/or required for the activity."

[player-count]
    name = "Player Count"
    desc = "How many different people can join this activity. Most activities support a range of these, not just one specific number."

[single-use]
    desc = "Whether the product is destroyed through usage, usually forcing you to print it again. By default, all our products ARE reusable."

[level]
    desc = "The general level needed to enjoy this material. (Check our curriculum to see how this relates to grade or age.)"

[search]
    desc = "The general search function for this website."

[subject]
    desc = "The subjects (loosely defined) this material teaches or explores."

[brand]
    desc = "The recognizable brand to which this product belongs."

[customizable]
    desc = "Whether the experience is MEANT to be customized. By default, All our products CAN be customized."

[interactive-media]
    name = "Interactive Media"
    desc = "Whether the experience plays interactive media (audio/video) or has an interactive program (file) to open."

[multiplayer-mode]
    name = "Multiplayer Mode"
    desc = "Whether the experience is competitive (against each other), cooperative (working together), or something else entirely."

[activity-structure]
    name = "Activity Structure"
    desc = "The overall structure of actions/turns in this activity. Options: Turn-based, simultaneous, real-time, other."