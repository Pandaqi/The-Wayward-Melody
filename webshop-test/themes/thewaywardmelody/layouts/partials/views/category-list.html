{{ $all_categories := .context.Site.Sections }} <!--- remember that .Section is always only the TOP-LEVEL/ROOT-LEVEL sections of websites --->
<nav class="flex flex-wrap flex-center gap-xs padding-xs">
    <ul>
    {{ range $all_categories }}
        <li><a href="{{ .RelPermalink }}" class="theme-art-{{ .Title | lowercase }} navigation-link">{{ .Title }}</a></li>
    {{ end }}
    </ul>
</nav>
