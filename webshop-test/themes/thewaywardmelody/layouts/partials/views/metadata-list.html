{{ $all_metadata := partial "func/get-all-taxonomies" . }}
{{ $relevant_metadata := or .Params.metadataRelevant $all_metadata }}
{{ $context := . }}
<div class="flex flex-wrap flex-center gap-xs padding-xs">
    {{ range $relevant_metadata }}
        {{ partial "views/metadata-item" (dict "context" $context "key" .) }}
    {{ end }}
</div>
