<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Online store selling educational material, puzzles, games, stories, escape rooms, quizzes, and more.">
    <link rel="shortcut icon" type="image/x-icon" href="/css/logos/twwm_favicon_minimal_colored.ico" />
    <link rel="canonical" href="https://thewaywardmelody.com{{ .RelPermalink }}" />
    <link rel="preconnect" href="https://app.snipcart.com">
    <link rel="preconnect" href="https://cdn.snipcart.com">
    <!--- <link rel="stylesheet" type="text/css" href="https://cdn.snipcart.com/themes/v3.7.0/default/snipcart.css" /> --->
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    {{ $opts := dict "transpiler" "dartsass" "targetPath" "css/style.css" }}
    {{ with resources.Get "sass/index.scss" }}
        {{ $style := . | css.Sass $opts }}
        <link rel="preload" href="{{ $style.RelPermalink }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="{{ $style.RelPermalink }}"></noscript>
    {{ end }}
</head>
