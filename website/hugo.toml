baseURL = "https://webshop-test.pages.dev" # "https://thewaywardmelody.com"
languageCode = "en-us"
title = "The Wayward Melody | Webshop of Magic"
theme = "thewaywardmelody"

[params]
  showTax = true

[markup.goldmark.renderer]
  unsafe = true

[pagination]
  disableAliases = true
  pagerSize = 10

[taxonomies]
  charm = "charm"
  spell = "spell"
  level = "level"
  language = "language"
  categories = "categories"
  subject = "subject"
  brand = "brand"
  player-count = "player-count"
  age = "age"
  requirements = "requirements"
  single-use = "single-use"
  duration = "duration"
  difficulty = "difficulty"
  setup = "setup"
  prior-wisdom = "prior-wisdom"
  color = "color"
  mature = "mature"
  textless = "textless"
  parallel-play = "parallel-play"
  double-sided-allowed = "double-sided-allowed"
  double-sided-required = "double-sided-required"
  guardian = "guardian"
  guardian-cant-play = "guardian-cant-play"
  hybrid = "hybrid"
  paper-fixed = "paper-fixed"
  linear = "linear"
  indoors = "indoors"
  outdoors = "outdoors"
  customizable = "customizable"
  interactive-media = "interactive-media" 
  multiplayer-mode = "multiplayer-mode" # cooperative, competitive, team-based, one-against-many
  activity-structure = "activity-structure" # turn-based, simultaneous, real-time, seasonal