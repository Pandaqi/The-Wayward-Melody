baseURL = 'https://webshop-test.pages.dev' # 'https://thewaywardmelody.com'
languageCode = 'en-us'
title = 'The Wayward Melody | Webshop of Magic'
theme = "thewaywardmelody"

paginate = 10

[params]
  showTax = true

[markup.goldmark.renderer]
  unsafe = true

[pagination]
  disableAliases = true
  pagerSize = 10

[taxonomies]
