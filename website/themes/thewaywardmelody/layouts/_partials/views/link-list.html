<span>
    {{ $num := len . }}
    {{ $counter := 0 }}
    {{ range . }}
        {{ $counter = add $counter 1 }}
        {{ $is_last := ge $counter $num }}
        <a class="hover_italic" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ if not $is_last }} &middot; {{ end }}
    {{ end }}
</span>
