{{ $img := or .Params.image "https://picsum.photos/500/386" }}
<div id="product-{{ .Params.id }}" class="bg-color-light-xx text-color-dark-xx padding-m rounded-m limit-width-s">
    <img loading="lazy" decoding="async" src="{{ $img }}" alt="Product Image for {{ .Params.title }}">
    <h2 class="align-center">{{ .Params.title }}</h2>
    <p>{{ .Params.description }}</p>
    <a href="{{ .Permalink }}" class="button button-size-m">Visit Product Page</a>
    {{ $show_buy_button := not .Params.bundle }}
    {{ if $show_buy_button }}
        {{ partial "products/product-button" . }}
    {{ end }}
</div>
