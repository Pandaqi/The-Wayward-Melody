{{ $all_factions := shuffle .context.Site.Sections }} <!--- remember that .Section is always only the TOP-LEVEL/ROOT-LEVEL sections of websites --->
{{ $image_size := 128 }}
<nav>    
    <ul class="flex flex-wrap flex-center gap-xs padding-xs remove-list-styling">
    {{ range $all_factions }}
        {{ $img_url := printf "/media/factions/faction_%s.webp" (.Title | urlize) }}
        <li class="hover_popup"><a href="{{ .RelPermalink }}">
            <img src="{{ $img_url }}" loading="lazy" decoding="async" width="{{ $image_size }}" height="{{ $image_size }}" />
        </a></li>
    {{ end }}
    </ul>
</nav>
