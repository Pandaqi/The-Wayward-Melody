  requirements = "requirements"
  reusable = "reusable"
  duration = "duration"
  difficulty = "difficulty"
  setup = "setup"
  prior-wisdom = "prior-wisdom"
  color = "color"
  mature = "mature"
  textless = "textless"
  parallel-play = "parallel-play"
  double-sided-allowed = "double-sided-allowed"
  double-sided-required = "double-sided-required"
  game-master = "game-master"
  game-master-can-play = "game-master-can-play"
  hybrid = "hybrid"
  paper-choice = "paper-choice"
  linear = "linear"
  indoors = "indoors"
  outdoors = "outdoors"